name: CI

on:
  push:
    paths:
      - 'learn-hono-zod/**'
      - 'learn-tiktoken/**'
      - 'learn-sse/**'
      - 'learn-mini-gateway/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'learn-hono-zod/**'
      - 'learn-tiktoken/**'
      - 'learn-sse/**'
      - 'learn-mini-gateway/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - learn-hono-zod
          - learn-tiktoken
          - learn-sse
          - learn-mini-gateway
        include:
          - project: learn-tiktoken
            run_demo: true
          - project: learn-sse
            run_ci: true
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - run: npm ci
      - name: Run typecheck
        if: matrix.run_ci != true
        run: npm run typecheck

      - name: Run project CI
        if: matrix.run_ci == true
        run: npm run ci

      - name: Run demo CLI
        if: matrix.run_demo
        run: npm run demo
