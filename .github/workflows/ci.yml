name: CI

on:
  push:
    paths:
      - 'learn-hono-zod/**'
      - 'learn-tiktoken/**'
      - 'learn-sse-websocket/**'
      - 'learn-mini-gateway/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'learn-hono-zod/**'
      - 'learn-tiktoken/**'
      - 'learn-sse-websocket/**'
      - 'learn-mini-gateway/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  learn-hono-zod:
    name: learn-hono-zod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn-hono-zod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: learn-hono-zod/package-lock.json

      - run: npm ci
      - run: npm run typecheck

  learn-tiktoken:
    name: learn-tiktoken
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn-tiktoken
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: learn-tiktoken/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run demo
